name: Deploy naar VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20 instellen
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencies installeren
        working-directory: frontend
        run: npm ci

      - name: Builden
        working-directory: frontend
        run: npm run build

      - name: Syncen naar /var/www/dashboard/
        run: rsync -a --delete frontend/dist/ /var/www/dashboard/
